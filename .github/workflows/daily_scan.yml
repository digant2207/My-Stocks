name: Daily Stock Screener & Live Market Scanner

on:
  schedule:
    - cron: '15 4 * * *'
    - cron: '0,15,30,45 4-10 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests ta beautifulsoup4

      - name: Execute Stock Scanner
        env:
          TZ: 'Asia/Kolkata'
        run: |
          python fast_runner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html app.js analysis_data.json analysis_data.js stocks_active.csv stocks.csv
          git diff --staged --quiet || git commit -m 'Automated Market Scanner Cloud Update'
          git push

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
