name: Daily Stock Screener & Live Market Scanner

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'analysis_data.json'
      - 'analysis_data.js'
      - 'scan_status.json'
  schedule:
    # 09:15 AM IST (03:45 AM UTC) - Market Opening Bell Scan (Mon-Fri)
    - cron: '45 3 * * 1-5'
    # Market Hours Scans (Every 30 mins: 09:30 AM to 03:30 PM IST / 04:00 AM to 10:00 AM UTC, Mon-Fri)
    - cron: '*/30 4-10 * * 1-5'
    # 06:00 PM IST (12:30 PM UTC) - Post-Market Evening Close Scan (Mon-Fri)
    - cron: '30 12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  scan-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests ta beautifulsoup4

      - name: Execute Stock Scanner
        env:
          TZ: 'Asia/Kolkata'
          CI: 'true'
          GITHUB_ACTIONS: 'true'
        run: |
          python fast_runner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html app.js analysis_data.json analysis_data.js stocks_active.csv stocks.csv scan_status.json
          if ! git diff --staged --quiet; then
            git commit -m 'Automated Market Scanner Cloud Update [skip ci]'
            if ! git push origin main; then
              echo "Remote branch has newer commits. Fetching and rebasing..."
              git fetch origin main
              if ! git rebase -X theirs origin/main; then
                echo "Rebase conflict occurred. Overwriting with latest scanner data on top of origin/main..."
                git rebase --abort || true
                git reset origin/main
                git add index.html app.js analysis_data.json analysis_data.js stocks_active.csv stocks.csv scan_status.json
                git commit -m 'Automated Market Scanner Cloud Update [skip ci]'
              fi
              git push origin main
            fi
          else
            echo "No changes to commit."
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
