name: Daily Stock Screener & Live Market Scanner

on:
  schedule:
    - cron: '30 3 * * *'
    - cron: '0,30 4-10 * * 1-5'
  workflow_dispatch:

jobs:
  scan-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas requests ta beautifulsoup4

      - name: Execute Stock Scanner
        run: |
          python fast_runner.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add index.html app.js analysis_data.json analysis_data.js stocks_active.csv stocks.csv
          git diff --staged --quiet || git commit -m 'Automated Market Scanner Cloud Update'
          git push
